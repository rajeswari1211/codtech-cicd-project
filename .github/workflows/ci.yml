name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Tests
        run: |
          python -m unittest test_app.py

      - name: Build Project
        run: |
          mkdir -p build
          cp app.py build/
          cp README.md build/
          echo "Build completed successfully." > build/build-status.txt

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codtech-cicd-build
          path: build/
